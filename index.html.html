<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>ScorexiFootball · Match Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

  /* ============================================================

     ============================================================ */

  /* ============================================================
     STATUS (loading / error / empty)

  .status.error { color: #f87171; }
  .status .big { font-size: 18px; color: #f0f0f2; font-weight: 800; margin-bottom: 8px; }
  .status .small { font-size: 12px; color: #6b6b73; margin-top: 6px; }

  /* ============================================================
     GRID
     ============================================================ */
  .grid-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 12px;

    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .grid-meta b { color: #d4ff00; }

  .grid {

  /* ============================================================
     GRID CARD (compact, clickable)
     ============================================================ */

    border: 1px solid #232328;

  .gc-footer {

  .row {

    justify-content: space-between;

  .row .item { text-align: center; flex: 1; }
  .row .item:not(:last-child) { border-right: 1px solid #232328; }

<script>
// ============================================================
//  CONFIG — API + endpoints
// ============================================================
const API = {
  host: 'betminer.p.rapidapi.com',
  key:  'b1d4f776c5msh0a5a6ce81cd9670p1e5ae8jsn169c02186937',
  path: (date) => `https://betminer.p.rapidapi.com/bm/v3/edge-analysis/${date}`
};

// ============================================================
//  STATE
// ============================================================
let allMatches = [];      // raw from API
let currentMatch = null;  // currently previewed match

// ============================================================
//  HELPERS
// ============================================================
function todayISO() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function formatWhen(iso) {
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const mon = d.toLocaleString('en-GB', { month: 'short' }).toUpperCase();
  return `${hh}:${mm} · ${day} ${mon}`;
}

function shortCode(name) {
  if (!name) return '—';
  const clean = name.replace(/[^A-Za-z0-9]/g, '');
  return clean.slice(0, 3).toUpperCase();
}

function resultLabel(result) {
  const map = {
    home_win: 'HOME WIN',
    away_win: 'AWAY WIN',
    home_or_draw: 'HOME OR DRAW',
    away_or_draw: 'AWAY OR DRAW',
    home_or_away: 'HOME OR AWAY',
    draw: 'DRAW'
  };
  return map[result] || (result || '—').toString().toUpperCase();
}

function pickProbability(match, result) {
  const p = match.probabilities || {};
  switch (result) {
    case 'home_win':      return p.home_win;
    case 'away_win':      return p.away_win;
    case 'draw':          return p.draw;
    case 'home_or_draw':  return (p.home_win != null && p.draw != null) ? p.home_win + p.draw : null;
    case 'away_or_draw':  return (p.away_win != null && p.draw != null) ? p.away_win + p.draw : null;
    case 'home_or_away':  return (p.home_win != null && p.away_win != null) ? p.home_win + p.away_win : null;
    default:              return null;
  }
}

function htftShort(htft) {
  if (!htft) return '—';
  const parts = htft.split('/');
  const short = (s) => {
    const t = s.trim().toLowerCase();
    if (t.startsWith('home')) return 'HOME';
    if (t.startsWith('away')) return 'AWAY';
    if (t.startsWith('draw')) return 'DRAW';
    return s.trim().toUpperCase();
  };
  return parts.map(short).join('/');
}

function renderForm(str) {
  if (!str) return '';
  return str.split('').map(c =>
    `<span class="dot ${c}">${c}</span>`
  ).join('');
}

// ============================================================
//  API FETCH
// ============================================================
async function fetchMatches(date) {
  const url = API.path(date);
  const res = await fetch(url, {
    method: 'GET',
    headers: {
      'x-rapidapi-key': API.key,
      'x-rapidapi-host': API.host
    }
  });
  if (!res.ok) throw new Error(`API ${res.status} ${res.statusText}`);
  const json = await res.json();
  if (!json.success) throw new Error('API returned success:false');
  return json.data || [];
}

// ============================================================
//  STATUS RENDERING
// ============================================================
function setStatus(elId, html) {
  const el = document.getElementById(elId);
  el.innerHTML = html;
}

function showLoading() {
  setStatus('gridStatus',
    `<div class="spinner"></div>Loading matches…`);
  document.getElementById('gridStatus').style.display = 'block';
  document.getElementById('grid').style.display = 'none';
}

function showError(msg) {
  setStatus('gridStatus',
    `<div class="big">⚠️ Could not load matches</div>
     <div class="small">${msg}</div>`);
  document.getElementById('gridStatus').className = 'status error';
  document.getElementById('gridStatus').style.display = 'block';
  document.getElementById('grid').style.display = 'none';
}

function hideStatus() {
  document.getElementById('gridStatus').style.display = 'none';
  document.getElementById('grid').style.display = 'grid';
}

// ============================================================
//  GRID RENDERING
// ============================================================
function populateLeagueFilter(matches) {
  const sel = document.getElementById('leagueSelect');
  const current = sel.value;
  const leagues = [...new Set(matches.map(m => m.competition?.name).filter(Boolean))].sort();

  sel.innerHTML = '<option value="all">All Leagues</option>' +
    leagues.map(l => `<option value="${l}">${l}</option>`).join('');

  if ([...sel.options].some(o => o.value === current)) sel.value = current;
}

function getFilteredMatches() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const league = document.getElementById('leagueSelect').value;

  return allMatches.filter(m => {
    const matchLeague = m.competition?.name || '';
    if (league !== 'all' && matchLeague !== league) return false;
    if (!q) return true;
    const haystack = `${m.home_team?.name || ''} ${m.away_team?.name || ''}`.toLowerCase();
    return haystack.includes(q);
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtered = getFilteredMatches();

  document.getElementById('gridCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="status" style="grid-column:1/-1;">
      <div class="big">No matches found</div>
      <div class="small">Try a different date or filter</div>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map((m, i) => {
    const pick = resultLabel(m.predictions?.result);
    const prob = pickProbability(m, m.predictions?.result);
    const homeName = m.home_team?.name || '—';
    const awayName = m.away_team?.name || '—';
    const homeLogo = m.home_team?.logo || '';
    const awayLogo = m.away_team?.logo || '';
    const league = m.competition?.name || '—';
    const when = formatWhen(m.kickoff);

    return `
      <div class="grid-card" data-idx="${i}">
        <div class="gc-top">
          <span class="gc-league">${league}</span>
          <span class="gc-time">${when}</span>
        </div>
        <div class="gc-teams">
          <div class="gc-team">
            <img src="${homeLogo}" alt="" crossorigin="anonymous">
            <div class="gc-name">${homeName}</div>
          </div>
          <div class="gc-team away">
            <img src="${awayLogo}" alt="" crossorigin="anonymous">
            <div class="gc-name">${awayName}</div>
          </div>
        </div>
        <div class="gc-footer">
          <span class="gc-pick">${pick}</span>
          <span class="gc-prob">${prob != null ? prob + '%' : ''}</span>
        </div>
      </div>
    `;
  }).join('');

  // Attach click handlers
  grid.querySelectorAll('.grid-card').forEach((el, i) => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      openPreview(filtered[idx]);
    });
  });
}

// ============================================================
//  PREVIEW RENDERING — fills the locked Scorex card
// ============================================================
function openPreview(match) {
  currentMatch = match;
  renderPreview(match);
  showView('preview');
}

function renderPreview(m) {
  const $ = (id) => document.getElementById(id);

  // Header
  $('when').textContent = formatWhen(m.kickoff);
  $('league').textContent = m.competition?.name || '—';

  // Teams
  $('homeLogo').src = m.home_team?.logo || '';
  $('homeName').textContent = m.home_team?.name || '—';
  $('awayLogo').src = m.away_team?.logo || '';
  $('awayName').textContent = m.away_team?.name || '—';
  $('homeCode').textContent = shortCode(m.home_team?.name);
  $('awayCode').textContent = shortCode(m.away_team?.name);

  // Prediction
  const pick = resultLabel(m.predictions?.result);
  const prob = pickProbability(m, m.predictions?.result);
  $('pick').textContent = prob != null ? `${pick} · ${prob}%` : pick;
  $('score').textContent = (m.predictions?.correct_score || '—').replace('-', ' – ');

  // Odds (auto-favorite = lowest odd)
  const homeOdd = m.odds?.home_win ? parseFloat(m.odds.home_win) : null;
  const drawOdd = m.odds?.draw ? parseFloat(m.odds.draw) : null;
  const awayOdd = m.odds?.away_win ? parseFloat(m.odds.away_win) : null;

  const oddVals = [
    { el: $('oddHome'), val: homeOdd },
    { el: $('oddDraw'), val: drawOdd },
    { el: $('oddAway'), val: awayOdd }
  ].filter(o => o.val != null && !isNaN(o.val));

  const minOdd = oddVals.length ? Math.min(...oddVals.map(o => o.val)) : null;

  const setOdd = (el, val) => {
    const v = el.querySelector('.val');
    v.textContent = (val != null && !isNaN(val)) ? val.toFixed(2) : '—';
    el.classList.toggle('fav', val != null && val === minOdd);
  };
  setOdd($('oddHome'), homeOdd);
  setOdd($('oddDraw'), drawOdd);
  setOdd($('oddAway'), awayOdd);

  // Extras
  const btts = m.predictions?.btts;
  $('btts').textContent = btts ? 'YES' : 'NO';
  $('btts').className = 'val ' + (btts ? 'g' : 'r');

  const o25 = m.predictions?.over_25;
  $('over25').textContent = o25 ? 'YES' : 'NO';
  $('over25').className = 'val ' + (o25 ? 'g' : 'r');

  $('htft').textContent = htftShort(m.predictions?.htft);

  // Form
  $('homeForm').innerHTML = renderForm(m.form?.home || '');
  $('awayForm').innerHTML = renderForm(m.form?.away || '');
}

// ============================================================
//  VIEW SWITCHING
// ============================================================
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(name === 'preview' ? 'viewPreview' : 'viewGrid').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
//  PNG EXPORT
// ============================================================
async function downloadCurrentCard() {
  if (!currentMatch) return;
  const card = document.getElementById('card');

  // Wait for logos to be loaded
  const imgs = card.querySelectorAll('img');
  await Promise.all([...imgs].map(img =>
    img.complete ? Promise.resolve() :
    new Promise(res => { img.onload = img.onerror = res; })
  ));

  const canvas = await html2canvas(card, {
    backgroundColor: '#0a0a0c',
    scale: 3,
    useCORS: true,
    logging: false
  });

  const home = (currentMatch.home_team?.name || 'home').replace(/\W+/g, '_');
  const away = (currentMatch.away_team?.name || 'away').replace(/\W+/g, '_');
  const filename = `scorexi_${home}_vs_${away}.png`;

  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ============================================================
//  MAIN LOAD
// ============================================================
async function loadDate(dateISO) {
  showLoading();
  try {
    const matches = await fetchMatches(dateISO);
    allMatches = matches;
    document.getElementById('gridDate').textContent = dateISO;
    populateLeagueFilter(matches);
    hideStatus();
    renderGrid();
  } catch (err) {
    console.error(err);
    showError(err.message || 'Unknown error');
  }
}

// ============================================================
//  EVENTS
// ============================================================
document.getElementById('dateInput').addEventListener('change', (e) => {
  if (e.target.value) loadDate(e.target.value);
});

document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('leagueSelect').addEventListener('change', renderGrid);

document.getElementById('refreshBtn').addEventListener('click', () => {
  const d = document.getElementById('dateInput').value || todayISO();
  loadDate(d);
});

document.getElementById('downloadBtn').addEventListener('click', downloadCurrentCard);
document.getElementById('backBtn').addEventListener('click', () => showView('grid'));

document.addEventListener('keydown', (e) => {
  const previewActive = document.getElementById('viewPreview').classList.contains('active');
  if (!previewActive) return;

  if (e.key.toLowerCase() === 's' && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    downloadCurrentCard();
  }
  if (e.key === 'Escape') {
    showView('grid');
  }
});

// ============================================================
//  INIT
// ============================================================
(function init() {
  const today = todayISO();
  document.getElementById('dateInput').value = today;
  loadDate(today);
})();
</script>
</body>
